# ─────────────────────────────────────────────────────────────────────────────
# Grafana config — fly.io
#
# Explicit file is more reliable than GF_SERVER_* env vars across image
# versions. Secrets (admin user/pass, InfluxDB token) are still injected via
# `fly secrets set` as GF_SECURITY_* and INFLUX_* env vars, which Grafana
# reads on top of this file.
# ─────────────────────────────────────────────────────────────────────────────

[server]
protocol   = http
http_addr  = 0.0.0.0
http_port  = 3000
domain     = savage-grafana.fly.dev
root_url   = https://savage-grafana.fly.dev

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db

[paths]
data         = /var/lib/grafana
logs         = /var/log/grafana
plugins      = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[log]
mode  = console
level = info

[analytics]
reporting_enabled  = false
check_for_updates  = false
