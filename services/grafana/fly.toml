# fly.toml app configuration file generated for savage-grafana on 2026-05-21T21:07:37-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'savage-grafana'
primary_region = 'sjc'

[build]

[env]
  # Server binding is set in grafana.ini (baked into the image).
  # Non-secret values only — credentials go via `fly secrets set`.
  INFLUX_URL = 'http://savage-influxdb.internal:8086'

[[mounts]]
  source = 'grafana_data'
  destination = '/var/lib/grafana'
  initial_size = '2gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '15s'
    grace_period = '120s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
