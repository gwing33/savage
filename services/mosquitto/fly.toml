# fly.toml app configuration file generated for savage-mosquitto on 2026-05-21T20:56:14-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'savage-mosquitto'
primary_region = 'sjc'

[build]

[[mounts]]
  source = 'mosquitto_data'
  destination = '/mosquitto/data'
  initial_size = '1gb'

[[services]]
  protocol = 'tcp'
  internal_port = 1883
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[services.ports]]
    port = 1883

[[services]]
  protocol = 'tcp'
  internal_port = 9001
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[services.ports]]
    port = 443
    handlers = ['tls']

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '15s'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
