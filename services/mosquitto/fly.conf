# ─────────────────────────────────────────────────────────────────────────────
# Mosquitto MQTT Broker – fly.io config
#
# Differences from the local config/mosquitto.conf:
#   • log_dest is stdout only (no file — fly captures stdout as logs)
#   • password_file is written at container start by docker-entrypoint.sh
# ─────────────────────────────────────────────────────────────────────────────

# ── Listeners ────────────────────────────────────────────────────────────────
listener 1883
protocol mqtt

listener 9001
protocol websockets

# ── Auth ─────────────────────────────────────────────────────────────────────
allow_anonymous false
password_file /mosquitto/config/passwd

# ── Persistence ──────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ──────────────────────────────────────────────────────────────────
log_dest stdout
log_type all
