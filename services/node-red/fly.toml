# fly.toml app configuration file generated for savage-node-red on 2026-05-21T21:05:45-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'savage-node-red'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  INFLUX_URL = 'http://savage-influxdb.internal:8086'
  PORT = '1880'

[[mounts]]
  source = 'node_red_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 1880
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '20s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
