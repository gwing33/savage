# fly.toml — Savage website
#
# First-time deploy:
#   fly launch --name savage-website --no-deploy   # creates the app
#   fly deploy
#
# SurrealDB connection secrets must be set before deploying:
#   fly secrets set SURREAL_URL=wss://your-surreal-app.fly.dev \
#     SURREAL_USER=root \
#     SURREAL_PASS=your-password \
#     SURREAL_NS=savage \
#     SURREAL_DB=main
#
# Subsequent deploys:
#   fly deploy

app = 'savage-website'
primary_region = 'sjc'

[build]

[env]
  PORT = '8080'
  # SurrealDB connection settings are provided as secrets (see above).
  # Do not add SURREAL_* vars here — use `fly secrets set` instead.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/'
    timeout = '10s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
